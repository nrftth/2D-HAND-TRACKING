<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinch & Drop: Hand Tracking Game</title>
    
    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <style>
        :root {
            --primary: #4F46E5;
            --bg-color: #111827;
            --text-color: #F9FAFB;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 1280px;
            max-width: 95vw;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* The hidden video element feeds the MediaPipe model */
        #input_video {
            display: none;
        }

        #output_canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to the canvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(17, 24, 39, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            transition: opacity 0.3s;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #4338CA;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        #loading-text {
            display: none;
            margin-top: 15px;
            font-size: 18px;
            color: #9CA3AF;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <video id="input_video"></video>
        <canvas id="output_canvas" width="1280" height="720"></canvas>
        
        <div id="ui-layer">
            <div class="hud">
                <div>Score: <span id="score-val">0</span></div>
                <div>Timer: <span id="timer-val">60</span>s</div>
            </div>
        </div>

        <div id="overlay">
            <h1 style="margin-bottom: 10px;">Pinch & Drop</h1>
            <p style="margin-bottom: 30px; text-align: center; max-width: 500px;">
                Use your webcam to play. Bring your <strong>thumb</strong> and <strong>index finger</strong> together to grab the yellow cubes. Drop them into the blue collection zone!
            </p>
            <button id="start-btn">Start Camera & Play</button>
            <div id="loading-text">Initializing AI Model... Please wait.</div>
        </div>
    </div>

    <script>
        // --- System & Web Audio Setup ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'grab') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'score') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        // --- Game Elements & Variables ---
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const scoreUI = document.getElementById('score-val');
        const timerUI = document.getElementById('timer-val');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');
        const loadingText = document.getElementById('loading-text');

        let isPlaying = false;
        let score = 0;
        let timer = 60;
        let lastTime = Date.now();
        
        // The Distance formula: $\sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2}$
        // Calculated in normalized coordinates
        const PINCH_THRESHOLD = 0.045; 
        let isPinched = false;
        let grabbedObject = null;
        let cursorPt = { x: 0, y: 0 };

        const targetArea = {
            x: 900, y: 500, w: 250, h: 150, color: '#3B82F6'
        };

        let objects = [];
        let particles = [];

        // Spawn a random draggable object
        function spawnObject() {
            objects.push({
                id: Math.random(),
                x: Math.random() * 600 + 100, // Keep them on the left side initially
                y: Math.random() * 500 + 100,
                w: 60, h: 60,
                color: '#F59E0B' // Amber/Yellow
            });
        }

        // Initialize 5 objects
        for(let i=0; i<5; i++) spawnObject();

        function spawnParticles(x, y) {
            for(let i=0; i<15; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: '#10B981'
                });
            }
        }

        function checkCollision(pt, rect) {
            return (pt.x >= rect.x && pt.x <= rect.x + rect.w &&
                    pt.y >= rect.y && pt.y <= rect.y + rect.h);
        }

        // --- Game Logic Loop ---
        function updateGameLogic() {
            if (!isPlaying) return;

            // Timer Logic
            const now = Date.now();
            if (now - lastTime >= 1000) {
                timer--;
                timerUI.innerText = timer;
                lastTime = now;
                if (timer <= 0) {
                    isPlaying = false;
                    overlay.style.display = 'flex';
                    overlay.style.opacity = '1';
                    overlay.innerHTML = `<h1>Game Over!</h1><h2>Final Score: ${score}</h2><button onclick="location.reload()">Play Again</button>`;
                }
            }

            // Update Particles
            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if(p.life <= 0) particles.splice(i, 1);
            }
        }

        // --- MediaPipe Hands Processing ---
        function onResults(results) {
            updateGameLogic();

            // Clear and draw video (mirrored for intuitive interaction)
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            
            // Apply a slight dark tint over the video to make game elements pop
            canvasCtx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

            let pinchDetectedThisFrame = false;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0]; // Process first hand detected
                
                // Index 4 is Thumb tip, Index 8 is Index Finger tip
                const thumb = landmarks[4];
                const index = landmarks[8];

                // Convert normalized coordinates to pixel canvas space
                const tX = thumb.x * canvasElement.width;
                const tY = thumb.y * canvasElement.height;
                const iX = index.x * canvasElement.width;
                const iY = index.y * canvasElement.height;

                // Midpoint for cursor position
                cursorPt.x = (tX + iX) / 2;
                cursorPt.y = (tY + iY) / 2;

                // Calculate Euclidean distance in normalized space
                const dist = Math.sqrt(Math.pow(thumb.x - index.x, 2) + Math.pow(thumb.y - index.y, 2));

                if (dist < PINCH_THRESHOLD) {
                    pinchDetectedThisFrame = true;
                }

                // Draw hand connector line
                canvasCtx.beginPath();
                canvasCtx.moveTo(tX, tY);
                canvasCtx.lineTo(iX, iY);
                canvasCtx.strokeStyle = pinchDetectedThisFrame ? '#10B981' : '#F43F5E';
                canvasCtx.lineWidth = 4;
                canvasCtx.stroke();
                
                // Draw cursor indicator
                canvasCtx.beginPath();
                canvasCtx.arc(cursorPt.x, cursorPt.y, 10, 0, 2 * Math.PI);
                canvasCtx.fillStyle = pinchDetectedThisFrame ? '#10B981' : 'rgba(255,255,255,0.5)';
                canvasCtx.fill();
            }

            // State Machine for Grabbing
            if (pinchDetectedThisFrame && !isPinched) {
                // Just pinched: check if hovering over an object
                for (let i = objects.length - 1; i >= 0; i--) {
                    if (checkCollision(cursorPt, objects[i])) {
                        grabbedObject = objects[i];
                        playSound('grab');
                        break; // Grab only one
                    }
                }
            } else if (!pinchDetectedThisFrame && isPinched) {
                // Just released: check if hovering over the target bag
                if (grabbedObject) {
                    const objCenter = {
                        x: grabbedObject.x + grabbedObject.w / 2,
                        y: grabbedObject.y + grabbedObject.h / 2
                    };
                    
                    if (checkCollision(objCenter, targetArea)) {
                        // Success!
                        score += 10;
                        scoreUI.innerText = score;
                        playSound('score');
                        spawnParticles(objCenter.x, objCenter.y);
                        
                        // Remove object and respawn a new one
                        objects = objects.filter(o => o.id !== grabbedObject.id);
                        spawnObject();
                    }
                    grabbedObject = null;
                }
            }
            
            isPinched = pinchDetectedThisFrame;

            // Update grabbed object position
            if (grabbedObject) {
                // Center object on cursor
                grabbedObject.x = cursorPt.x - grabbedObject.w / 2;
                grabbedObject.y = cursorPt.y - grabbedObject.h / 2;
            }

            // --- Render Game Elements ---
            
            // Draw Target Bag
            canvasCtx.fillStyle = targetArea.color;
            canvasCtx.beginPath();
            canvasCtx.roundRect(targetArea.x, targetArea.y, targetArea.w, targetArea.h, 15);
            canvasCtx.fill();
            canvasCtx.lineWidth = 4;
            canvasCtx.strokeStyle = 'white';
            canvasCtx.stroke();
            
            // Bag Text
            canvasCtx.fillStyle = 'white';
            canvasCtx.font = '24px Arial';
            canvasCtx.textAlign = 'center';
            canvasCtx.fillText("DROP ZONE", targetArea.x + targetArea.w/2, targetArea.y + targetArea.h/2 + 8);

            // Draw Objects
            objects.forEach(obj => {
                canvasCtx.fillStyle = obj.color;
                canvasCtx.shadowColor = 'rgba(0,0,0,0.5)';
                canvasCtx.shadowBlur = 10;
                if (obj === grabbedObject) {
                    canvasCtx.fillStyle = '#FBBF24'; // Highlight when grabbed
                    canvasCtx.shadowBlur = 20;
                    canvasCtx.shadowColor = 'white';
                }
                
                canvasCtx.beginPath();
                canvasCtx.roundRect(obj.x, obj.y, obj.w, obj.h, 8);
                canvasCtx.fill();
                
                // Reset shadow for performance
                canvasCtx.shadowBlur = 0; 
                canvasCtx.strokeStyle = '#B45309';
                canvasCtx.lineWidth = 2;
                canvasCtx.stroke();
            });

            // Draw Particles
            particles.forEach(p => {
                canvasCtx.globalAlpha = p.life;
                canvasCtx.fillStyle = p.color;
                canvasCtx.beginPath();
                canvasCtx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                canvasCtx.fill();
            });
            canvasCtx.globalAlpha = 1.0;

            canvasCtx.restore();
        }

        // --- Initialization ---
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6,
            selfieMode: true // Mirrors the tracking so movement feels natural
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });

        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none';
            loadingText.style.display = 'block';
            
            // Initialize Audio Context on user gesture
            if(audioCtx.state === 'suspended') audioCtx.resume();

            camera.start().then(() => {
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.style.display = 'none';
                    isPlaying = true;
                    lastTime = Date.now();
                }, 300);
            }).catch(err => {
                alert("Could not access webcam. Please ensure permissions are granted.");
                startBtn.style.display = 'block';
                loadingText.style.display = 'none';
                console.error(err);
            });
        });
    </script>
</body>
</html>
